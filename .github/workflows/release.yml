name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.4 (tag will be created)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "SDK ready"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Publish release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          APK="Thesis.Hub_${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Automated build and release via GitHub Actions."
          gh release create "$VERSION" "$APK" --title "Thesis Hub $VERSION" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
